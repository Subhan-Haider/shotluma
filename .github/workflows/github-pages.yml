name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'github-pages/**'
      - 'public/brand/**'
      - 'public/favicon.ico'
      - 'public/favicon-32x32.png'
      - 'public/apple-touch-icon.png'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare static site
        run: |
          mkdir -p _site/brand
          cp github-pages/index.html github-pages/robots.txt github-pages/sitemap.xml _site/
          cp public/brand/shotluma-logo.webp _site/brand/
          cp public/favicon.ico public/favicon-32x32.png public/apple-touch-icon.png _site/
          # Project Pages serve under /shotluma/; keep asset URLs relative.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
